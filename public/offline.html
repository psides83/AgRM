<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#103c24" />
    <title>AgRM Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f2;
        color: #172118;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
      }

      img {
        width: 64px;
        height: 64px;
        display: block;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #516052;
        font-size: 1rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101711;
          color: #f4f7f2;
        }

        p {
          color: #bac5b6;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/app-icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>AgRM needs a connection to load fresh CRM data. Reconnect and refresh when you are ready.</p>
    </main>
  </body>
</html>
